name: Prashanth'sFirstWorkFlow
#on: workflow_dispatch
#on: push
on: 
  push:
     paths:
       - 'src/**'
       - '.github/workflows/**'
       - '!docs/**'
jobs:
  prashanthsfirstjob:
    runs-on: ubuntu-latest
    outputs:
      output1: ${{steps.ID_Of_DLastStepFirstJobWithOutput.outputs.outputFromStep4J1}}
    steps:
      - name: FirstStepDisplayingTriggerEvent
        run: |
          echo "Executing the first step. This exection was trigged by ${{ github.event_name }}"
          echo "The last commit message is: ${{ github.event.head_commit.message }}"
        
      - name: SecondStepThatUsesUses
        uses: actions/checkout@v4
        
      - name: ThirdStepThatUsesUses
        uses: actions/setup-node@v4
        with:
          node-version: 24        
      - name: LastStepFirstJobWithOutput
        id: ID_Of_DLastStepFirstJobWithOutput
        run: echo "outputFromStep4J1=Executing the Last step in FirstJob"  >> $GITHUB_OUTPUT
        
  prashanthsSecondjobWithDepOnFirst:
    needs: prashanthsfirstjob
    runs-on: ubuntu-latest
    steps:
      - run: echo "This is the output Exported from Job1 and pased to Job2 ${{ needs.prashanthsfirstjob.outputs.output1}}"
  
      
  
  
